name: Create/Delete Branch for Pull Request

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

# Branch names come from github.head_ref (always set on pull_request
# events, including fork PRs and Dependabot's slashed branch names).
# This replaced tj-actions/branch-names: v8 was vulnerable to command
# injection via crafted branch names (CVE-2025-54416, CVSS 9.1), and
# the tj-actions org already had its tags retroactively compromised
# once (changed-files, March 2025). A context expression needs no
# third-party code and no extra setup job.
#
# Both jobs skip Dependabot PRs: Dependabot-triggered runs only get
# Dependabot-scoped secrets, so secrets.NEON_API_KEY resolves empty
# and the action fails with "Input required and not supplied:
# api_key". Dependency bumps don't need a per-PR database branch.

jobs:
  create_neon_branch:
    name: Create Neon Branch
    outputs:
      db_url: ${{ steps.create_neon_branch.outputs.db_url }}
      db_url_with_pooler: ${{ steps.create_neon_branch.outputs.db_url_with_pooler }}
    if: |
      github.event.pull_request.user.login != 'dependabot[bot]' && (
      github.event.action == 'synchronize'
      || github.event.action == 'opened'
      || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    steps:
      - name: Get branch expiration date as an env variable (2 weeks from now)
        id: get_expiration_date
        run: echo "EXPIRES_AT=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Create Neon Branch
        id: create_neon_branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.number }}-${{ github.head_ref }}
          api_key: ${{ secrets.NEON_API_KEY }}
          database: tattoo-studio
          role: tattoo-studio_owner
          expires_at: ${{ env.EXPIRES_AT }}

  delete_neon_branch:
    name: Delete Neon Branch
    if: |
      github.event.pull_request.user.login != 'dependabot[bot]'
      && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon Branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}-${{ github.head_ref }}
          api_key: ${{ secrets.NEON_API_KEY }}
