name: Setup
description: Restore bun + node_modules cache; only install on miss.

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.x

    - name: Restore deps cache
      id: cache
      uses: actions/cache@v6
      with:
        path: |
          ~/.bun/install/cache
          node_modules
        # Key on package.json too, not just bun.lock: a PR that edits
        # package.json without regenerating bun.lock must MISS this
        # cache so the frozen-lockfile install below fails loudly on
        # the desync, instead of restoring stale node_modules and
        # green-lighting CI against dependencies that were never
        # actually installed (bit us in PRs #36 and #70).
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}

    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: bun install --frozen-lockfile --no-progress
